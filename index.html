<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Bulk Scheduler</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
                    },
                    colors: {
                        fb: '#1877F2',
                        'fb-hover': '#166FE5'
                    }
                }
            }
        }
    </script>
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & ReactDOM (Production) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel standalone for JSX compilation in browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Hide scrollbar for clean internal lists */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 transition-colors duration-200 antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;

        // ==========================================
        // UTILS & DB (LocalStorage)
        // ==========================================
        const generateId = () => Math.random().toString(36).substring(2, 15);

        class DB {
            static get(key, defaultValue) {
                const stored = localStorage.getItem(`fbsched_${key}`);
                return stored ? JSON.parse(stored) : defaultValue;
            }
            static set(key, value) {
                localStorage.setItem(`fbsched_${key}`, JSON.stringify(value));
            }
        }

        // ==========================================
        // REAL FACEBOOK GRAPH API INTEGRATION
        // ==========================================
        const GraphAPI = {
            init(appId) {
                return new Promise((resolve) => {
                    if (window.FB) {
                        window.FB.init({
                            appId      : appId,
                            cookie     : true,
                            xfbml      : true,
                            version    : 'v20.0' // Latest Graph API version
                        });
                        return resolve();
                    }
                    if (document.getElementById('facebook-jssdk')) {
                        return resolve(); // Script already injected
                    }
                    window.fbAsyncInit = function() {
                        FB.init({
                            appId      : appId,
                            cookie     : true,
                            xfbml      : true,
                            version    : 'v20.0'
                        });
                        resolve();
                    };
                    (function(d, s, id) {
                        var js, fjs = d.getElementsByTagName(s)[0];
                        if (d.getElementById(id)) return;
                        js = d.createElement(s); js.id = id;
                        js.src = "https://connect.facebook.net/en_US/sdk.js";
                        fjs.parentNode.insertBefore(js, fjs);
                    }(document, 'script', 'facebook-jssdk'));
                });
            },

            getUserInfo() {
                return new Promise((resolve, reject) => {
                    FB.api('/me', {fields: 'id,name,picture'}, function(response) {
                        if (response.error) reject(response.error);
                        else resolve(response);
                    });
                });
            },

            getPages() {
                return new Promise((resolve, reject) => {
                    // Fetch accounts with infinite pagination handled simply for now
                    FB.api('/me/accounts', {fields: 'id,name,access_token,picture{url}', limit: 100}, function(response) {
                        if (response.error) {
                            reject(response.error);
                        } else if (response && response.data) {
                            resolve(response.data.map(p => ({
                                id: p.id,
                                name: p.name,
                                accessToken: p.access_token,
                                picture: p.picture?.data?.url || 'https://via.placeholder.com/50'
                            })));
                        } else {
                            resolve([]);
                        }
                    });
                });
            },

            async schedulePost(page, post) {
                return new Promise((resolve) => {
                    // Facebook Graph API expects Unix Timestamp (Seconds) for scheduled posts
                    const unixTime = Math.floor(new Date(post.scheduledDate).getTime() / 1000);
                    
                    const payload = {
                        message: post.payload.text,
                        published: false, // Essential for scheduling
                        scheduled_publish_time: unixTime,
                        access_token: page.accessToken
                    };

                    if (post.payload.link) {
                        payload.link = post.payload.link;
                    }

                    // Execute the actual POST request
                    FB.api(
                        `/${page.id}/feed`,
                        'POST',
                        payload,
                        function (response) {
                            if (!response || response.error) {
                                resolve({ error: response.error });
                            } else {
                                resolve({ id: response.id });
                            }
                        }
                    );
                });
            }
        };

        // ==========================================
        // REUSABLE COMPONENTS
        // ==========================================
        function StatusBadge({ status }) {
            const styles = {
                pending: 'bg-yellow-100 text-yellow-800 dark:bg-yellow-900/40 dark:text-yellow-400',
                scheduled: 'bg-green-100 text-green-800 dark:bg-green-900/40 dark:text-green-400',
                published: 'bg-blue-100 text-blue-800 dark:bg-blue-900/40 dark:text-blue-400',
                failed: 'bg-red-100 text-red-800 dark:bg-red-900/40 dark:text-red-400',
                cancelled: 'bg-gray-200 text-gray-800 dark:bg-gray-700 dark:text-gray-300',
            };
            return (
                <span className={`px-2.5 py-1 rounded-full text-xs font-bold uppercase tracking-wider ${styles[status]}`}>
                    {status}
                </span>
            );
        }

        function ConfirmModal({ isOpen, title, message, onConfirm, onCancel }) {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div className="bg-white dark:bg-gray-800 rounded-2xl p-6 max-w-sm w-full shadow-2xl border border-gray-200 dark:border-gray-700">
                        <h3 className="text-xl font-bold mb-2 dark:text-white">{title}</h3>
                        <p className="text-gray-600 dark:text-gray-300 mb-6">{message}</p>
                        <div className="flex justify-end gap-3">
                            <button onClick={onCancel} className="px-4 py-2 rounded-xl text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 font-medium transition-colors">إلغاء</button>
                            <button onClick={onConfirm} className="px-4 py-2 rounded-xl bg-red-600 hover:bg-red-700 text-white font-medium transition-colors">تأكيد</button>
                        </div>
                    </div>
                </div>
            );
        }

        function Toast({ message, type, onClose }) {
            if (!message) return null;
            const colors = type === 'error' ? 'bg-red-100 border-red-500 text-red-800' : 'bg-green-100 border-green-500 text-green-800';
            const icon = type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle';
            return (
                <div className={`fixed bottom-6 right-6 flex items-center gap-3 px-4 py-3 rounded-xl border-l-4 shadow-lg z-50 ${colors} animate-fade-in`}>
                    <i className={`fas ${icon} text-lg`}></i>
                    <p className="font-medium text-sm sm:text-base max-w-xs break-words">{message}</p>
                    <button onClick={onClose} className="ml-4 opacity-70 hover:opacity-100"><i className="fas fa-times"></i></button>
                </div>
            );
        }

        // ==========================================
        // MAIN VIEWS
        // ==========================================
        
        function Dashboard({ posts }) {
            const stats = useMemo(() => ({
                total: posts.length,
                scheduled: posts.filter(p => p.status === 'scheduled').length,
                published: posts.filter(p => p.status === 'published').length,
                pending: posts.filter(p => p.status === 'pending').length,
                failed: posts.filter(p => p.status === 'failed').length,
            }), [posts]);

            const cards = [
                { label: 'إجمالي المنشورات', value: stats.total, icon: 'fa-file-alt', color: 'text-blue-500', bg: 'bg-blue-100 dark:bg-blue-900/30' },
                { label: 'مجدول بنجاح', value: stats.scheduled, icon: 'fa-check-circle', color: 'text-green-500', bg: 'bg-green-100 dark:bg-green-900/30' },
                { label: 'قيد الانتظار', value: stats.pending, icon: 'fa-clock', color: 'text-yellow-500', bg: 'bg-yellow-100 dark:bg-yellow-900/30' },
                { label: 'فشل النشر', value: stats.failed, icon: 'fa-times-circle', color: 'text-red-500', bg: 'bg-red-100 dark:bg-red-900/30' },
            ];

            return (
                <div className="space-y-6 max-w-6xl mx-auto animate-fade-in" dir="rtl">
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                        {cards.map((card, i) => (
                            <div key={i} className="bg-white dark:bg-gray-800 p-6 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-sm flex items-center gap-4 transition-transform hover:-translate-y-1">
                                <div className={`p-4 rounded-xl ${card.bg} ${card.color}`}>
                                    <i className={`fas ${card.icon} text-2xl`}></i>
                                </div>
                                <div>
                                    <p className="text-gray-500 dark:text-gray-400 text-sm font-medium">{card.label}</p>
                                    <h4 className="text-2xl font-bold dark:text-white">{card.value}</h4>
                                </div>
                            </div>
                        ))}
                    </div>

                    <div className="bg-white dark:bg-gray-800 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-sm p-6">
                        <h3 className="text-lg font-semibold mb-4 dark:text-white">أحدث المنشورات المجدولة</h3>
                        <div className="space-y-3">
                            {posts.slice(0, 5).map(post => (
                                <div key={post.id} className="flex items-center justify-between p-4 bg-gray-50 dark:bg-gray-900/50 rounded-xl border border-gray-100 dark:border-gray-700">
                                    <div className="flex flex-col">
                                        <span className="font-medium text-sm truncate max-w-[200px] sm:max-w-md dark:text-gray-200">
                                            {post.payload.text || 'منشور وسائط'}
                                        </span>
                                        <span className="text-xs text-gray-500 mt-1">
                                            <i className="far fa-calendar-alt ml-1"></i>
                                            {new Date(post.scheduledDate).toLocaleString('ar-EG')}
                                        </span>
                                    </div>
                                    <StatusBadge status={post.status} />
                                </div>
                            ))}
                            {posts.length === 0 && <p className="text-gray-500 text-sm text-center py-6 border-2 border-dashed border-gray-200 dark:border-gray-700 rounded-xl">لا توجد منشورات مجدولة حتى الآن.</p>}
                        </div>
                    </div>
                </div>
            );
        }

        function Scheduler({ pages, settings, setPosts, addLog }) {
            const [selectedPage, setSelectedPage] = useState(settings.defaultPageId || pages[0]?.id || '');
            const [payload, setPayload] = useState({ text: '', link: '' });
            const [startDate, setStartDate] = useState('');
            const [endDate, setEndDate] = useState('');
            const [times, setTimes] = useState(settings.defaultPostingTimes.length ? settings.defaultPostingTimes : ['09:00', '15:00']);
            
            const [generatedPreview, setGeneratedPreview] = useState([]);
            const [isProcessing, setIsProcessing] = useState(false);
            const [progress, setProgress] = useState({ current: 0, total: 0 });
            const [toastMsg, setToastMsg] = useState(null);

            const showToast = (msg, type='error') => {
                setToastMsg({ message: msg, type });
                setTimeout(() => setToastMsg(null), 5000);
            };

            const handleGenerate = () => {
                if (!selectedPage || !payload.text || !startDate || !endDate || times.length === 0) {
                    showToast("يرجى تعبئة الحقول المطلوبة (الصفحة، النص، التواريخ، الأوقات).", "error");
                    return;
                }

                const start = new Date(startDate);
                const end = new Date(endDate);
                const now = new Date();
                
                if (end < start) {
                    showToast("تاريخ النهاية لا يمكن أن يكون قبل تاريخ البداية.", "error");
                    return;
                }

                const preview = [];
                let curr = new Date(start);

                while (curr <= end) {
                    for (const timeStr of times) {
                        const [hours, minutes] = timeStr.split(':').map(Number);
                        const schedDate = new Date(curr);
                        schedDate.setHours(hours, minutes, 0, 0);

                        // FB requires schedule time to be between 10 mins and 75 days from now
                        const diffMins = (schedDate.getTime() - now.getTime()) / (1000 * 60);
                        
                        if (diffMins > 10 && diffMins < (75 * 24 * 60)) {
                            preview.push({
                                id: generateId(),
                                pageId: selectedPage,
                                payload: { ...payload },
                                scheduledDate: schedDate.toISOString(),
                                status: 'pending',
                                createdAt: new Date().toISOString()
                            });
                        }
                    }
                    curr.setDate(curr.getDate() + 1);
                }

                if (preview.length === 0) {
                    showToast("لم يتم توليد أي تواريخ صحيحة (تأكد أن الأوقات تقع في المستقبل بمدة 10 دقائق على الأقل ولا تتجاوز 75 يوماً كما يشترط فيسبوك).", "error");
                    return;
                }

                setGeneratedPreview(preview);
                addLog('info', 'تم إنشاء قائمة الجدولة', `تم تجهيز ${preview.length} منشور للمعاينة.`);
            };

            const processQueue = async (queue) => {
                setIsProcessing(true);
                setProgress({ current: 0, total: queue.length });
                
                const page = pages.find(p => p.id === selectedPage);
                setPosts(prev => [...queue, ...prev]);
                setGeneratedPreview([]); 
                
                let successCount = 0;
                let failCount = 0;

                for (let i = 0; i < queue.length; i++) {
                    const currentPost = queue[i];
                    setProgress(p => ({ ...p, current: i + 1 }));
                    
                    const response = await GraphAPI.schedulePost(page, currentPost);
                    
                    setPosts(prev => prev.map(p => {
                        if (p.id === currentPost.id) {
                            if (response.error) {
                                failCount++;
                                addLog('error', 'خطأ في Graph API', `فشل المنشور ${p.id}: ${response.error.message}`);
                                return { ...p, status: 'failed', errorMsg: response.error.message };
                            } else {
                                successCount++;
                                addLog('success', 'تم الجدولة بنجاح', `FB ID: ${response.id}`);
                                return { ...p, status: 'scheduled', fbPostId: response.id };
                            }
                        }
                        return p;
                    }));
                }
                
                setIsProcessing(false);
                addLog('info', 'اكتملت العملية المجمعة', `تم معالجة ${queue.length}. نجح: ${successCount}, فشل: ${failCount}.`);
                showToast(`تمت الجدولة! نجح ${successCount}، وفشل ${failCount}.`, failCount > 0 ? 'error' : 'success');
            };

            const addTime = () => {
                const val = document.getElementById('newTime').value;
                if(val && !times.includes(val)) setTimes([...times, val].sort());
            };

            return (
                <div className="max-w-6xl mx-auto flex flex-col xl:flex-row gap-6 animate-fade-in" dir="rtl">
                    {toastMsg && <Toast message={toastMsg.message} type={toastMsg.type} onClose={() => setToastMsg(null)} />}
                    
                    {/* Left Form */}
                    <div className="flex-1 space-y-6">
                        <div className="bg-white dark:bg-gray-800 p-6 rounded-2xl border border-gray-200 dark:border-gray-700 shadow-sm">
                            <h3 className="text-lg font-bold mb-4 dark:text-white flex items-center gap-2">
                                <i className="fab fa-facebook text-fb"></i> 1. اختر الصفحة
                            </h3>
                            <select 
                                value={selectedPage} 
                                onChange={e => setSelectedPage(e.target.value)}
                                className="w-full bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white border border-gray-300 dark:border-gray-600 rounded-xl px-4 py-3 outline-none focus:border-fb transition-all"
                            >
                                <option value="">اختر صفحة فيسبوك...</option>
                                {pages.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                            </select>
                        </div>

                        <div className="bg-white dark:bg-gray-800 p-6 rounded-2xl border border-gray-200 dark:border-gray-700 shadow-sm space-y-5">
                            <h3 className="text-lg font-bold dark:text-white flex items-center gap-2">
                                <i className="fas fa-edit text-blue-500"></i> 2. محتوى المنشور
                            </h3>
                            
                            <div>
                                <label className="block text-sm font-semibold mb-2 dark:text-gray-300">النص / الكابشن (مطلوب)</label>
                                <textarea 
                                    rows="4" 
                                    className="w-full bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white border border-gray-300 dark:border-gray-600 rounded-xl px-4 py-3 outline-none focus:border-fb transition-all resize-none"
                                    placeholder="بم تفكر؟ هذا النص سيتم استخدامه في جميع المنشورات المجدولة."
                                    value={payload.text}
                                    onChange={e => setPayload({...payload, text: e.target.value})}
                                />
                            </div>

                            <div>
                                <label className="block text-sm font-semibold mb-2 dark:text-gray-300">رابط (اختياري)</label>
                                <div className="relative">
                                    <i className="fas fa-link absolute right-4 top-3.5 text-gray-400"></i>
                                    <input 
                                        type="url" 
                                        className="w-full pr-10 pl-4 bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white border border-gray-300 dark:border-gray-600 rounded-xl py-3 outline-none focus:border-fb text-left"
                                        placeholder="https://..." dir="ltr"
                                        value={payload.link}
                                        onChange={e => setPayload({...payload, link: e.target.value})}
                                    />
                                </div>
                            </div>
                        </div>

                        <div className="bg-white dark:bg-gray-800 p-6 rounded-2xl border border-gray-200 dark:border-gray-700 shadow-sm space-y-5">
                            <h3 className="text-lg font-bold dark:text-white flex items-center gap-2">
                                <i className="fas fa-clock text-green-500"></i> 3. إعدادات التواريخ والأوقات
                            </h3>
                            
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-semibold mb-2 dark:text-gray-300">تاريخ البداية *</label>
                                    <input type="date" value={startDate} onChange={e => setStartDate(e.target.value)} className="w-full bg-gray-50 dark:bg-gray-900 dark:text-white border border-gray-300 dark:border-gray-600 rounded-xl px-4 py-3 outline-none focus:border-fb" />
                                </div>
                                <div>
                                    <label className="block text-sm font-semibold mb-2 dark:text-gray-300">تاريخ النهاية *</label>
                                    <input type="date" value={endDate} onChange={e => setEndDate(e.target.value)} className="w-full bg-gray-50 dark:bg-gray-900 dark:text-white border border-gray-300 dark:border-gray-600 rounded-xl px-4 py-3 outline-none focus:border-fb" />
                                </div>
                            </div>

                            <div>
                                <label className="block text-sm font-semibold mb-3 dark:text-gray-300">أوقات النشر اليومية *</label>
                                <div className="flex flex-wrap gap-3">
                                    {times.map((t, idx) => (
                                        <div key={idx} className="bg-blue-50 dark:bg-blue-900/40 text-blue-700 dark:text-blue-300 px-4 py-2 rounded-xl flex items-center gap-3 text-sm font-bold border border-blue-100 dark:border-blue-800">
                                            <i className="far fa-clock"></i> <span dir="ltr">{t}</span>
                                            <button onClick={() => setTimes(times.filter((_, i) => i !== idx))} className="hover:text-red-500 transition-colors mr-2"><i className="fas fa-times-circle"></i></button>
                                        </div>
                                    ))}
                                    <div className="flex items-center gap-2 bg-gray-50 dark:bg-gray-900 rounded-xl border border-gray-300 dark:border-gray-600 p-1">
                                        <input type="time" id="newTime" className="bg-transparent px-2 outline-none text-sm font-bold dark:text-white" />
                                        <button onClick={addTime} className="p-2 bg-gray-200 dark:bg-gray-700 rounded-lg hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200"><i className="fas fa-plus"></i></button>
                                    </div>
                                </div>
                            </div>

                            <button onClick={handleGenerate} className="w-full mt-6 bg-gray-900 dark:bg-gray-100 text-white dark:text-gray-900 font-bold py-4 rounded-xl hover:bg-gray-800 dark:hover:bg-gray-200 transition-transform active:scale-[0.99] shadow-md">
                                إنشاء قائمة المواعيد (معاينة)
                            </button>
                        </div>
                    </div>

                    {/* Right Preview */}
                    <div className="flex-1 lg:max-w-md xl:max-w-lg flex flex-col">
                        <div className="bg-white dark:bg-gray-800 rounded-2xl border border-gray-200 dark:border-gray-700 shadow-sm flex-1 flex flex-col overflow-hidden sticky top-20 max-h-[calc(100vh-100px)]">
                            <div className="p-6 border-b border-gray-100 dark:border-gray-700 flex justify-between items-center bg-gray-50 dark:bg-gray-900/50">
                                <h3 className="text-lg font-bold dark:text-white"><i className="fas fa-list-ul text-gray-400 ml-2"></i> معاينة الطابور</h3>
                                <span className="bg-fb text-white text-xs font-bold px-3 py-1.5 rounded-full shadow-sm">
                                    {generatedPreview.length} منشور
                                </span>
                            </div>
                            
                            <div className="flex-1 overflow-y-auto p-4 space-y-3">
                                {generatedPreview.length === 0 ? (
                                    <div className="h-full flex flex-col items-center justify-center text-gray-400 space-y-4">
                                        <i className="far fa-calendar-times text-5xl opacity-20"></i>
                                        <p className="font-medium">حدد التواريخ والوقت واضغط إنشاء.</p>
                                    </div>
                                ) : (
                                    generatedPreview.map((item, idx) => (
                                        <div key={item.id} className="flex items-center justify-between p-4 rounded-xl border border-gray-100 dark:border-gray-700 bg-gray-50 dark:bg-gray-900/30">
                                            <div className="flex items-center gap-4">
                                                <span className="text-gray-400 font-mono font-bold w-6 text-left">{idx + 1}.</span>
                                                <div>
                                                    <p className="font-bold dark:text-gray-200">{new Date(item.scheduledDate).toLocaleDateString('ar-EG')}</p>
                                                    <p className="text-xs text-gray-500 font-mono mt-1"><i className="far fa-clock ml-1"></i>{new Date(item.scheduledDate).toLocaleTimeString('ar-EG', {hour: '2-digit', minute:'2-digit'})}</p>
                                                </div>
                                            </div>
                                            <button onClick={() => setGeneratedPreview(prev => prev.filter(p => p.id !== item.id))} className="text-gray-400 hover:text-red-500 p-2 transition-colors">
                                                <i className="fas fa-trash-alt"></i>
                                            </button>
                                        </div>
                                    ))
                                )}
                            </div>

                            {generatedPreview.length > 0 && (
                                <div className="p-5 border-t border-gray-100 dark:border-gray-700 bg-white dark:bg-gray-800 shadow-[0_-10px_30px_rgba(0,0,0,0.05)] z-10">
                                    {isProcessing ? (
                                        <div className="space-y-3">
                                            <div className="flex justify-between text-sm font-bold dark:text-gray-300">
                                                <span><i className="fas fa-spinner fa-spin ml-2"></i> جاري الاتصال بخوادم ميتا...</span>
                                                <span dir="ltr">{progress.current} / {progress.total}</span>
                                            </div>
                                            <div className="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-3 overflow-hidden">
                                                <div className="bg-fb h-3 rounded-full transition-all duration-300 relative" style={{ width: `${(progress.current / progress.total) * 100}%` }}>
                                                    <div className="absolute inset-0 bg-white/20 animate-pulse"></div>
                                                </div>
                                            </div>
                                        </div>
                                    ) : (
                                        <button onClick={() => processQueue(generatedPreview)} className="w-full bg-fb hover:bg-fb-hover text-white font-bold py-4 rounded-xl transition-all shadow-lg shadow-blue-500/30 flex items-center justify-center gap-2 text-lg active:scale-[0.98]">
                                            <i className="fas fa-paper-plane"></i> جدولة الكل فعلياً (Graph API)
                                        </button>
                                    )}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // ==========================================
        // LOGIN SCREEN (Fixed Async SDK Issue)
        // ==========================================
        function LoginScreen({ onLogin, theme, toggleTheme }) {
            const [loading, setLoading] = useState(false);
            // وضعت لك رقم تطبيقك بشكل افتراضي هنا:
            const [appId, setAppId] = useState(() => DB.get('fb_app_id', '1209280678019831'));
            const [error, setError] = useState('');
            
            // تحميل SDK فيسبوك بمجرد كتابة رقم التطبيق لتجهيزه قبل أن يضغط المستخدم
            useEffect(() => {
                if (appId && appId.trim().length > 10) {
                    GraphAPI.init(appId.trim()).catch(e => console.log('SDK Load Error:', e));
                }
            }, [appId]);

            const handleLogin = () => {
                if (!appId.trim()) {
                    return setError('يرجى إدخال Facebook App ID الخاص بك.');
                }
                
                setLoading(true);
                setError('');
                DB.set('fb_app_id', appId.trim());

                // دالة الاتصال المباشرة (يجب أن تنفذ بشكل متزامن مع زر الضغط لتجنب حظر النافذة)
                const executeLogin = () => {
                    FB.login(async function(response) {
                        if (response.authResponse) {
                            try {
                                const userInfo = await GraphAPI.getUserInfo();
                                const userPages = await GraphAPI.getPages();
                                onLogin({
                                    user: { id: userInfo.id, name: userInfo.name, picture: userInfo.picture?.data?.url || 'https://via.placeholder.com/150' },
                                    pages: userPages
                                });
                            } catch (e) {
                                setError('فشل جلب بيانات الصفحات: ' + (e.message || 'خطأ غير معروف'));
                                setLoading(false);
                            }
                        } else {
                            setError('تم إلغاء تسجيل الدخول أو إغلاق النافذة، أو أن المتصفح قام بحظر النافذة المنبثقة.');
                            setLoading(false);
                        }
                    }, {scope: 'pages_manage_posts,pages_show_list,pages_read_engagement'});
                };

                // إذا كان SDK محملاً، افتح النافذة فوراً. إذا لم يكن، حاول تهيئته ثم الفتح.
                if (window.FB) {
                    executeLogin();
                } else {
                    GraphAPI.init(appId.trim()).then(() => {
                        executeLogin();
                    }).catch(err => {
                        setError('لا يمكن الاتصال بفيسبوك. تأكد من إيقاف أدوات حظر الإعلانات (Ad-blockers).');
                        setLoading(false);
                    });
                }
            };

            return (
                <div className={`min-h-screen flex items-center justify-center bg-gray-50 dark:bg-gray-900 transition-colors duration-200 ${theme}`} dir="rtl">
                    <button onClick={toggleTheme} className="absolute top-6 left-6 w-12 h-12 flex items-center justify-center rounded-full bg-white dark:bg-gray-800 shadow-md border border-gray-100 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
                        <i className={`fas ${theme === 'dark' ? 'fa-sun text-yellow-400' : 'fa-moon text-gray-600'} text-xl`}></i>
                    </button>

                    <div className="max-w-md w-full p-10 bg-white dark:bg-gray-800 rounded-3xl shadow-2xl shadow-blue-500/10 border border-gray-100 dark:border-gray-700 text-center relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-fb to-blue-400"></div>
                        
                        <div className="w-20 h-20 bg-gradient-to-tr from-fb to-blue-500 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-lg shadow-blue-500/40">
                            <i className="fab fa-facebook-f text-4xl text-white"></i>
                        </div>
                        
                        <h1 className="text-3xl font-extrabold text-gray-900 dark:text-white mb-2">الجدولة المجمعة</h1>
                        <p className="text-gray-500 dark:text-gray-400 mb-6 text-sm leading-relaxed">تطبيق متصل رسمياً بـ Meta Graph API</p>
                        
                        <div className="mb-6 text-right">
                            <label className="block text-sm font-bold mb-2 dark:text-gray-300">Facebook App ID</label>
                            <input 
                                type="text" 
                                value={appId}
                                onChange={(e) => setAppId(e.target.value)}
                                placeholder="مثال: 1209280678019831"
                                className="w-full bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white border border-gray-300 dark:border-gray-600 rounded-xl px-4 py-3 outline-none focus:border-fb text-left"
                                dir="ltr"
                            />
                            {error && <p className="text-red-500 text-xs mt-3 font-medium bg-red-50 p-2 rounded-lg border border-red-100"><i className="fas fa-exclamation-circle ml-1"></i> {error}</p>}
                        </div>

                        <button 
                            onClick={handleLogin} disabled={loading}
                            className="w-full flex items-center justify-center gap-3 bg-fb hover:bg-fb-hover text-white py-4 px-6 rounded-xl font-bold text-lg transition-transform hover:scale-[1.02] active:scale-95 shadow-xl shadow-blue-500/30 disabled:opacity-70 disabled:hover:scale-100"
                        >
                            {loading ? <i className="fas fa-spinner fa-spin"></i> : <i className="fab fa-facebook"></i>}
                            {loading ? 'جاري فتح نافذة فيسبوك...' : 'تسجيل الدخول باستخدام فيسبوك'}
                        </button>
                        
                        <div className="mt-8 pt-6 border-t border-gray-100 dark:border-gray-700">
                            <p className="text-xs text-gray-400 dark:text-gray-500 font-medium leading-loose">
                                <i className="fas fa-lock ml-1"></i> نطلب فقط صلاحية النشر عبر صفحاتك.<br/>
                                <i className="fas fa-info-circle ml-1"></i> تأكد من تفعيل "النوافذ المنبثقة" في المتصفح.
                            </p>
                        </div>
                    </div>
                </div>
            );
        }

        // ==========================================
        // MAIN APP SHELL (Sidebar & Routing)
        // ==========================================
        function Sidebar({ view, setView, user, onLogout }) {
            const nav = [
                { id: 'dashboard', icon: 'fa-chart-pie', label: 'لوحة القيادة' },
                { id: 'scheduler', icon: 'fa-plus-square', label: 'جدولة جديدة' },
                { id: 'settings', icon: 'fa-cog', label: 'الإعدادات' },
            ];

            return (
                <aside className="w-64 bg-white dark:bg-gray-800 border-l border-gray-200 dark:border-gray-700 flex flex-col transition-colors z-20 hidden md:flex shadow-[4px_0_24px_rgba(0,0,0,0.02)]" dir="rtl">
                    <div className="p-6 flex items-center gap-3">
                        <div className="bg-gradient-to-br from-fb to-blue-600 w-10 h-10 rounded-xl flex items-center justify-center shadow-md shadow-blue-500/30 shrink-0"><i className="fab fa-facebook-f text-white text-lg"></i></div>
                        <span className="font-extrabold text-xl tracking-tight dark:text-white truncate">FB Scheduler</span>
                    </div>

                    <nav className="flex-1 px-4 py-2 space-y-1.5 overflow-y-auto">
                        {nav.map(item => {
                            const active = view === item.id;
                            return (
                                <button
                                    key={item.id}
                                    onClick={() => setView(item.id)}
                                    className={`w-full flex items-center gap-3.5 px-4 py-3.5 rounded-xl transition-all font-bold text-sm ${
                                        active 
                                            ? 'bg-blue-50 dark:bg-fb text-fb dark:text-white shadow-sm' 
                                            : 'text-gray-600 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-gray-700/50'
                                    }`}
                                >
                                    <i className={`fas ${item.icon} w-5 text-center ${active ? '' : 'opacity-70'}`}></i>
                                    {item.label}
                                </button>
                            )
                        })}
                    </nav>

                    <div className="p-4 border-t border-gray-100 dark:border-gray-700 bg-gray-50/50 dark:bg-gray-900/20">
                        <div className="flex items-center gap-3 p-2 bg-white dark:bg-gray-800 rounded-xl border border-gray-100 dark:border-gray-700 shadow-sm">
                            <img src={user.picture} alt="User" className="w-10 h-10 rounded-lg bg-gray-200 shrink-0" />
                            <div className="flex-1 min-w-0">
                                <p className="text-sm font-bold truncate dark:text-white">{user.name}</p>
                            </div>
                            <button onClick={onLogout} className="text-gray-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-900/30 transition-colors w-8 h-8 rounded-lg flex items-center justify-center shrink-0" title="تسجيل الخروج">
                                <i className="fas fa-sign-out-alt"></i>
                            </button>
                        </div>
                    </div>
                </aside>
            );
        }

        function App() {
            const [theme, setTheme] = useState(() => DB.get('theme', 'light'));
            const [user, setUser] = useState(() => DB.get('user', null));
            const [view, setView] = useState('dashboard');
            
            const [pages, setPages] = useState(() => DB.get('pages', []));
            const [posts, setPosts] = useState(() => DB.get('posts', []));
            const [logs, setLogs] = useState(() => DB.get('logs', []));
            const [settings, setSettings] = useState(() => DB.get('settings', {
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                defaultPostingTimes: ['09:00', '15:00', '21:00'],
            }));

            // Sync States
            useEffect(() => { DB.set('theme', theme); }, [theme]);
            useEffect(() => { DB.set('user', user); }, [user]);
            useEffect(() => { DB.set('pages', pages); }, [pages]);
            useEffect(() => { DB.set('posts', posts); }, [posts]);
            useEffect(() => { DB.set('logs', logs); }, [logs]);
            useEffect(() => { DB.set('settings', settings); }, [settings]);

            useEffect(() => {
                const root = document.documentElement;
                if (theme === 'dark') root.classList.add('dark');
                else root.classList.remove('dark');
            }, [theme]);

            const addLog = useCallback((level, action, details) => {
                setLogs(prev => [{ id: generateId(), timestamp: new Date().toISOString(), level, action, details }, ...prev].slice(0, 100));
            }, []);

            const login = (authData) => {
                setUser(authData.user);
                setPages(authData.pages);
                addLog('success', 'تسجيل دخول ناجح', `تم ربط حساب: ${authData.user.name}`);
            };

            const logout = () => {
                setUser(null);
                setPages([]);
                if (window.FB) window.FB.logout();
                addLog('info', 'تسجيل خروج', 'تم إنهاء الجلسة.');
            };

            if (!user) {
                return <LoginScreen onLogin={login} theme={theme} toggleTheme={() => setTheme(t => t === 'dark' ? 'light' : 'dark')} />;
            }

            const viewTitles = { dashboard: 'نظرة عامة', scheduler: 'الجدولة التلقائية', settings: 'الإعدادات' };

            return (
                <div className={`min-h-screen flex transition-colors duration-200 ${theme}`} dir="rtl">
                    <Sidebar view={view} setView={setView} user={user} onLogout={logout} />
                    
                    <main className="flex-1 flex flex-col h-screen overflow-hidden bg-gray-50 dark:bg-gray-900 relative">
                        <header className="h-20 bg-white/80 dark:bg-gray-900/80 backdrop-blur-xl border-b border-gray-200 dark:border-gray-800 flex items-center justify-between px-8 sticky top-0 z-30">
                            <div className="flex items-center gap-4">
                                <button className="md:hidden text-gray-500 hover:text-gray-900 dark:hover:text-white"><i className="fas fa-bars text-xl"></i></button>
                                <h2 className="text-2xl font-extrabold tracking-tight dark:text-white">{viewTitles[view]}</h2>
                            </div>
                            <button 
                                onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')}
                                className="w-10 h-10 rounded-full flex items-center justify-center bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors shadow-sm border border-gray-200 dark:border-gray-700"
                            >
                                <i className={`fas ${theme === 'dark' ? 'fa-sun text-yellow-400' : 'fa-moon text-gray-600'}`}></i>
                            </button>
                        </header>
                        
                        <div className="flex-1 overflow-y-auto p-6 md:p-8">
                            <style>{`
                                @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
                                .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
                            `}</style>
                            
                            {view === 'dashboard' && <Dashboard posts={posts} />}
                            {view === 'scheduler' && <Scheduler pages={pages} settings={settings} setPosts={setPosts} addLog={addLog} />}
                            {view === 'settings' && (
                                <div className="max-w-2xl mx-auto bg-white dark:bg-gray-800 p-8 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 animate-fade-in">
                                    <h2 className="text-xl font-bold mb-6 dark:text-white border-b border-gray-100 dark:border-gray-700 pb-4">إعدادات الحساب</h2>
                                    <div className="space-y-4">
                                        <p className="dark:text-gray-300 text-sm">تم ربط التطبيق بنجاح مع صفحاتك.</p>
                                        <p className="dark:text-gray-300 text-sm">المنطقة الزمنية الحالية: {settings.timezone}</p>
                                        <p className="dark:text-gray-300 text-sm">عدد الصفحات المتاحة للإدارة: <strong>{pages.length}</strong> صفحة.</p>
                                        <button onClick={logout} className="mt-4 px-6 py-2 bg-red-50 text-red-600 hover:bg-red-500 hover:text-white rounded-xl transition-colors font-bold">إلغاء ربط فيسبوك</button>
                                    </div>
                                </div>
                            )}
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
