<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Bulk Scheduler</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
                    },
                    colors: {
                        fb: '#1877F2',
                        'fb-hover': '#166FE5'
                    }
                }
            }
        }
    </script>
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & ReactDOM (Production) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel standalone for JSX compilation in browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 transition-colors duration-200 antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;

        // ==========================================
        // UTILS & DB
        // ==========================================
        const generateId = () => Math.random().toString(36).substring(2, 15);

        class DB {
            static get(key, defaultValue) {
                const stored = localStorage.getItem(`fbsched_${key}`);
                return stored ? JSON.parse(stored) : defaultValue;
            }
            static set(key, value) {
                localStorage.setItem(`fbsched_${key}`, JSON.stringify(value));
            }
        }

        // --- REAL FACEBOOK GRAPH API INTEGRATION ---
        const GraphAPI = {
            init(appId) {
                return new Promise((resolve, reject) => {
                    if (window.FB) return resolve();
                    window.fbAsyncInit = function() {
                        window.FB.init({
                            appId      : appId,
                            cookie     : true,
                            xfbml      : true,
                            version    : 'v20.0'
                        });
                        resolve();
                    };
                    (function(d, s, id) {
                        var js, fjs = d.getElementsByTagName(s)[0];
                        if (d.getElementById(id)) { resolve(); return; }
                        js = d.createElement(s); js.id = id;
                        js.src = "https://connect.facebook.net/en_US/sdk.js";
                        js.onerror = () => reject(new Error("تم حظر الاتصال بفيسبوك. يرجى إيقاف مانع الإعلانات (AdBlock)."));
                        fjs.parentNode.insertBefore(js, fjs);
                    }(document, 'script', 'facebook-jssdk'));
                });
            },
            
            login() {
                return new Promise((resolve, reject) => {
                    window.FB.login(function(response) {
                        if (response.authResponse) {
                            resolve(response.authResponse);
                        } else {
                            reject(new Error('تم إلغاء تسجيل الدخول أو لم تمنح الصلاحيات.'));
                        }
                    }, {scope: 'pages_manage_posts,pages_show_list,pages_read_engagement'});
                });
            },

            getUserInfo() {
                return new Promise((resolve) => {
                    window.FB.api('/me', {fields: 'id,name,picture'}, function(response) { resolve(response); });
                });
            },

            getPages() {
                return new Promise((resolve) => {
                    window.FB.api('/me/accounts', {fields: 'id,name,access_token,picture{url}'}, function(response) {
                        if (response && response.data) {
                            resolve(response.data.map(p => ({
                                id: p.id, name: p.name, accessToken: p.access_token,
                                picture: p.picture?.data?.url || 'https://via.placeholder.com/50'
                            })));
                        } else { resolve([]); }
                    });
                });
            },

            async schedulePost(page, post) {
                return new Promise((resolve) => {
                    const unixTime = Math.floor(new Date(post.scheduledDate).getTime() / 1000);
                    
                    // إذا كان البوست يحتوي على صورة
                    if (post.payload.mediaFile) {
                        const formData = new FormData();
                        formData.append('source', post.payload.mediaFile);
                        formData.append('message', post.payload.text);
                        formData.append('published', 'false'); // لجعله مجدولاً وغير منشور فوراً
                        formData.append('scheduled_publish_time', unixTime);
                        formData.append('access_token', page.accessToken);

                        // استخدام Fetch API للتعامل مع رفع الملفات بشكل أفضل من FB.api
                        fetch(`https://graph.facebook.com/v20.0/${page.id}/photos`, {
                            method: 'POST',
                            body: formData
                        })
                        .then(res => res.json())
                        .then(response => {
                            if (response.error) resolve({ error: response.error });
                            // فيسبوك يرجع post_id للصور المجدولة
                            else resolve({ id: response.post_id || response.id });
                        })
                        .catch(err => resolve({ error: { message: err.message || "فشل رفع الصورة" } }));
                    } 
                    // إذا كان البوست نص/رابط فقط
                    else {
                        const payload = {
                            message: post.payload.text,
                            published: false,
                            scheduled_publish_time: unixTime,
                            access_token: page.accessToken
                        };
                        if (post.payload.link) payload.link = post.payload.link;

                        window.FB.api(`/${page.id}/feed`, 'POST', payload, function (response) {
                            if (!response || response.error) resolve({ error: response.error });
                            else resolve({ id: response.id });
                        });
                    }
                });
            }
        };

        // ==========================================
        // REUSABLE COMPONENTS
        // ==========================================
        function StatusBadge({ status }) {
            const styles = {
                pending: 'bg-yellow-100 text-yellow-800 dark:bg-yellow-900/40 dark:text-yellow-400',
                scheduled: 'bg-green-100 text-green-800 dark:bg-green-900/40 dark:text-green-400',
                published: 'bg-blue-100 text-blue-800 dark:bg-blue-900/40 dark:text-blue-400',
                failed: 'bg-red-100 text-red-800 dark:bg-red-900/40 dark:text-red-400',
                cancelled: 'bg-gray-200 text-gray-800 dark:bg-gray-700 dark:text-gray-300',
            };
            return <span className={`px-2.5 py-1 rounded-full text-xs font-bold uppercase tracking-wider ${styles[status]}`}>{status}</span>;
        }

        function ConfirmModal({ isOpen, title, message, onConfirm, onCancel }) {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div className="bg-white dark:bg-gray-800 rounded-2xl p-6 max-w-sm w-full shadow-2xl border border-gray-200 dark:border-gray-700">
                        <h3 className="text-xl font-bold mb-2 dark:text-white">{title}</h3>
                        <p className="text-gray-600 dark:text-gray-300 mb-6">{message}</p>
                        <div className="flex justify-end gap-3">
                            <button onClick={onCancel} className="px-4 py-2 rounded-xl text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 font-medium">Cancel</button>
                            <button onClick={onConfirm} className="px-4 py-2 rounded-xl bg-red-600 hover:bg-red-700 text-white font-medium">Confirm</button>
                        </div>
                    </div>
                </div>
            );
        }

        function Toast({ message, type, onClose }) {
            if (!message) return null;
            const colors = type === 'error' ? 'bg-red-100 border-red-500 text-red-800' : 'bg-green-100 border-green-500 text-green-800';
            const icon = type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle';
            return (
                <div className={`fixed bottom-6 right-6 flex items-center gap-3 px-4 py-3 rounded-xl border-l-4 shadow-lg z-50 ${colors}`}>
                    <i className={`fas ${icon} text-lg`}></i><p className="font-medium">{message}</p>
                    <button onClick={onClose} className="ml-4 opacity-70 hover:opacity-100"><i className="fas fa-times"></i></button>
                </div>
            );
        }

        // ==========================================
        // MAIN VIEWS
        // ==========================================
        function Dashboard({ posts }) {
            const stats = useMemo(() => ({
                total: posts.length,
                scheduled: posts.filter(p => p.status === 'scheduled').length,
                published: posts.filter(p => p.status === 'published').length,
                pending: posts.filter(p => p.status === 'pending').length,
                failed: posts.filter(p => p.status === 'failed').length,
            }), [posts]);

            const cards = [
                { label: 'Total Posts', value: stats.total, icon: 'fa-file-alt', color: 'text-blue-500', bg: 'bg-blue-100 dark:bg-blue-900/30' },
                { label: 'Scheduled (API)', value: stats.scheduled, icon: 'fa-check-circle', color: 'text-green-500', bg: 'bg-green-100 dark:bg-green-900/30' },
                { label: 'Pending Processor', value: stats.pending, icon: 'fa-clock', color: 'text-yellow-500', bg: 'bg-yellow-100 dark:bg-yellow-900/30' },
                { label: 'Failed', value: stats.failed, icon: 'fa-times-circle', color: 'text-red-500', bg: 'bg-red-100 dark:bg-red-900/30' },
            ];

            return (
                <div className="space-y-6 max-w-6xl mx-auto animate-fade-in">
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                        {cards.map((card, i) => (
                            <div key={i} className="bg-white dark:bg-gray-800 p-6 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-sm flex items-center gap-4">
                                <div className={`p-4 rounded-xl ${card.bg} ${card.color}`}><i className={`fas ${card.icon} text-2xl`}></i></div>
                                <div><p className="text-gray-500 dark:text-gray-400 text-sm font-medium">{card.label}</p><h4 className="text-2xl font-bold dark:text-white">{card.value}</h4></div>
                            </div>
                        ))}
                    </div>

                    <div className="bg-white dark:bg-gray-800 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-sm p-6">
                        <h3 className="text-lg font-semibold mb-4 dark:text-white">Recent Activity</h3>
                        <div className="space-y-3">
                            {posts.slice(0, 5).map(post => (
                                <div key={post.id} className="flex items-center justify-between p-4 bg-gray-50 dark:bg-gray-900/50 rounded-xl border border-gray-100 dark:border-gray-700">
                                    <div className="flex flex-col">
                                        <span className="font-medium text-sm truncate max-w-[200px] sm:max-w-md dark:text-gray-200">{post.payload.text || 'Media Post'}</span>
                                        <span className="text-xs text-gray-500"><i className="far fa-calendar-alt mr-1"></i>{new Date(post.scheduledDate).toLocaleString()}</span>
                                    </div>
                                    <StatusBadge status={post.status} />
                                </div>
                            ))}
                            {posts.length === 0 && <p className="text-gray-500 text-sm text-center py-6">No posts scheduled yet.</p>}
                        </div>
                    </div>
                </div>
            );
        }

        function Scheduler({ pages, settings, setPosts, addLog }) {
            const [selectedPage, setSelectedPage] = useState(settings.defaultPageId || pages[0]?.id || '');
            const [payload, setPayload] = useState({ text: '', link: '', mediaFile: null, mediaPreview: null });
            const [startDate, setStartDate] = useState('');
            const [endDate, setEndDate] = useState('');
            const [times, setTimes] = useState(settings.defaultPostingTimes.length ? settings.defaultPostingTimes : ['09:00']);
            
            const [generatedPreview, setGeneratedPreview] = useState([]);
            const [isProcessing, setIsProcessing] = useState(false);
            const [progress, setProgress] = useState({ current: 0, total: 0 });
            const [toastMsg, setToastMsg] = useState(null);

            const showToast = (msg, type='error') => { setToastMsg({ message: msg, type }); setTimeout(() => setToastMsg(null), 4000); };

            const handleGenerate = () => {
                if (!selectedPage || (!payload.text && !payload.mediaFile) || !startDate || !endDate || times.length === 0) 
                    return showToast("يرجى تعبئة الحقول المطلوبة (الصفحة، النص أو الصورة، والتاريخ).", "error");
                
                const start = new Date(startDate); const end = new Date(endDate);
                if (end < start) return showToast("End date cannot be before start date.", "error");

                const preview = []; let curr = new Date(start);
                while (curr <= end) {
                    for (const timeStr of times) {
                        const [hours, minutes] = timeStr.split(':').map(Number);
                        const schedDate = new Date(curr); schedDate.setHours(hours, minutes, 0, 0);
                        if (schedDate.getTime() > new Date().getTime()) {
                            preview.push({ id: generateId(), pageId: selectedPage, payload: { ...payload }, scheduledDate: schedDate.toISOString(), status: 'pending', createdAt: new Date().toISOString() });
                        }
                    }
                    curr.setDate(curr.getDate() + 1);
                }
                if (preview.length === 0) return showToast("No valid future dates generated.", "error");
                setGeneratedPreview(preview);
                addLog('info', 'Schedule Generated', `Generated ${preview.length} datetimes.`);
            };

            const processQueue = async (queue) => {
                setIsProcessing(true); setProgress({ current: 0, total: queue.length });
                const page = pages.find(p => p.id === selectedPage);
                
                // إضافة المجدولات للقائمة مع إزالة ملف الصورة لتجنب مشاكل التخزين المحلي (LocalStorage)
                const queueForState = queue.map(q => ({
                    ...q, 
                    payload: { ...q.payload, mediaFile: null } // لا نخزن الملفات في الذاكرة المحلية
                }));
                setPosts(prev => [...queueForState, ...prev]); 
                setGeneratedPreview([]); 
                let successCount = 0; let failCount = 0;

                for (let i = 0; i < queue.length; i++) {
                    const currentPost = queue[i]; setProgress(p => ({ ...p, current: i + 1 }));
                    const response = await GraphAPI.schedulePost(page, currentPost);
                    setPosts(prev => prev.map(p => {
                        if (p.id === currentPost.id) {
                            if (response.error) {
                                failCount++; addLog('error', 'Graph API Error', `Post ${p.id} failed: ${response.error.message}`);
                                return { ...p, status: 'failed', errorMsg: response.error.message };
                            } else {
                                successCount++; addLog('success', 'Post Scheduled', `FB ID: ${response.id}`);
                                return { ...p, status: 'scheduled', fbPostId: response.id };
                            }
                        }
                        return p;
                    }));
                }
                setIsProcessing(false);
                addLog('info', 'Bulk Complete', `Processed ${queue.length}. Success: ${successCount}, Failed: ${failCount}.`);
                showToast(`Scheduling complete! ${successCount} succeeded, ${failCount} failed.`, failCount > 0 ? 'error' : 'success');
            };

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    setPayload({
                        ...payload,
                        mediaFile: file,
                        mediaPreview: URL.createObjectURL(file)
                    });
                }
            };

            const removeImage = () => {
                setPayload({ ...payload, mediaFile: null, mediaPreview: null });
            };

            return (
                <div className="max-w-6xl mx-auto flex flex-col xl:flex-row gap-6 animate-fade-in">
                    {toastMsg && <Toast message={toastMsg.message} type={toastMsg.type} onClose={() => setToastMsg(null)} />}
                    <div className="flex-1 space-y-6">
                        <div className="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700">
                            <h3 className="text-lg font-bold mb-4 dark:text-white"><i className="fab fa-facebook text-fb mr-2"></i> 1. Select Target Page</h3>
                            <select value={selectedPage} onChange={e => setSelectedPage(e.target.value)} className="w-full bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white border border-gray-300 dark:border-gray-600 rounded-xl px-4 py-3 outline-none">
                                <option value="">Select a Facebook Page...</option>
                                {pages.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                            </select>
                        </div>
                        <div className="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 space-y-5">
                            <h3 className="text-lg font-bold dark:text-white"><i className="fas fa-edit text-blue-500 mr-2"></i> 2. Content Setup</h3>
                            <div>
                                <label className="block text-sm font-semibold mb-2 dark:text-gray-300">Caption / Text</label>
                                <textarea rows="4" className="w-full bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white border border-gray-300 dark:border-gray-600 rounded-xl px-4 py-3 outline-none resize-none" value={payload.text} onChange={e => setPayload({...payload, text: e.target.value})} placeholder="اكتب محتوى المنشور هنا..." />
                            </div>
                            
                            {/* منطقة رفع الصورة */}
                            <div>
                                <label className="block text-sm font-semibold mb-2 dark:text-gray-300">Image Upload (Optional)</label>
                                {!payload.mediaPreview ? (
                                    <label className="flex flex-col items-center justify-center w-full h-32 border-2 border-gray-300 border-dashed rounded-xl cursor-pointer bg-gray-50 dark:hover:bg-gray-800 dark:bg-gray-900 hover:bg-gray-100 dark:border-gray-600 dark:hover:border-gray-500">
                                        <div className="flex flex-col items-center justify-center pt-5 pb-6 text-gray-500 dark:text-gray-400">
                                            <i className="fas fa-cloud-upload-alt text-2xl mb-2"></i>
                                            <p className="text-sm font-semibold">اضغط لرفع صورة</p>
                                        </div>
                                        <input type="file" className="hidden" accept="image/*" onChange={handleImageUpload} />
                                    </label>
                                ) : (
                                    <div className="relative w-full h-48 rounded-xl overflow-hidden border border-gray-200 dark:border-gray-700">
                                        <img src={payload.mediaPreview} alt="Preview" className="w-full h-full object-cover" />
                                        <button onClick={removeImage} className="absolute top-2 right-2 bg-red-500 text-white p-2 rounded-lg hover:bg-red-600 shadow-lg">
                                            <i className="fas fa-trash-alt"></i>
                                        </button>
                                    </div>
                                )}
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-semibold mb-2 dark:text-gray-300">Link URL (Optional)</label>
                                    <input type="url" className="w-full bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white border border-gray-300 dark:border-gray-600 rounded-xl px-4 py-3 outline-none" value={payload.link} onChange={e => setPayload({...payload, link: e.target.value})} />
                                </div>
                            </div>
                        </div>
                        <div className="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 space-y-5">
                            <h3 className="text-lg font-bold dark:text-white"><i className="fas fa-clock text-green-500 mr-2"></i> 3. Bulk Schedule Timing</h3>
                            <div className="grid grid-cols-2 gap-4">
                                <div><label className="block text-sm font-semibold mb-2 dark:text-gray-300">Start Date *</label><input type="date" value={startDate} onChange={e => setStartDate(e.target.value)} className="w-full bg-gray-50 dark:bg-gray-900 dark:text-white border border-gray-300 dark:border-gray-600 rounded-xl px-4 py-3 outline-none" /></div>
                                <div><label className="block text-sm font-semibold mb-2 dark:text-gray-300">End Date *</label><input type="date" value={endDate} onChange={e => setEndDate(e.target.value)} className="w-full bg-gray-50 dark:bg-gray-900 dark:text-white border border-gray-300 dark:border-gray-600 rounded-xl px-4 py-3 outline-none" /></div>
                            </div>
                            <div>
                                <label className="block text-sm font-semibold mb-3 dark:text-gray-300">Posting Times (Daily) *</label>
                                <div className="flex flex-wrap gap-3">
                                    {times.map((t, idx) => (
                                        <div key={idx} className="bg-blue-50 dark:bg-blue-900/40 text-blue-700 dark:text-blue-300 px-4 py-2 rounded-xl flex items-center gap-3 font-bold border border-blue-100 dark:border-blue-800">
                                            {t} <button onClick={() => setTimes(times.filter((_, i) => i !== idx))} className="hover:text-red-500"><i className="fas fa-times-circle"></i></button>
                                        </div>
                                    ))}
                                    <div className="flex items-center gap-2 bg-gray-50 dark:bg-gray-900 rounded-xl border border-gray-300 dark:border-gray-600 p-1">
                                        <input type="time" id="newTime" className="bg-transparent px-2 outline-none dark:text-white" />
                                        <button onClick={() => {const v = document.getElementById('newTime').value; if(v && !times.includes(v)) setTimes([...times, v].sort());}} className="p-2 bg-gray-200 dark:bg-gray-700 rounded-lg"><i className="fas fa-plus"></i></button>
                                    </div>
                                </div>
                            </div>
                            <button onClick={handleGenerate} className="w-full bg-gray-900 dark:bg-gray-100 text-white dark:text-gray-900 font-bold py-4 rounded-xl">Generate Preview</button>
                        </div>
                    </div>

                    <div className="flex-1 lg:max-w-md xl:max-w-lg flex flex-col">
                        <div className="bg-white dark:bg-gray-800 rounded-2xl border border-gray-200 dark:border-gray-700 shadow-sm flex-1 flex flex-col overflow-hidden sticky top-20 max-h-[calc(100vh-100px)]">
                            <div className="p-6 border-b border-gray-100 dark:border-gray-700 flex justify-between items-center bg-gray-50 dark:bg-gray-900/50">
                                <h3 className="font-bold dark:text-white">Queue Preview</h3>
                                <span className="bg-fb text-white text-xs font-bold px-3 py-1.5 rounded-full">{generatedPreview.length} items</span>
                            </div>
                            <div className="flex-1 overflow-y-auto p-4 space-y-3">
                                {generatedPreview.map((item, idx) => (
                                    <div key={item.id} className="flex items-center justify-between p-4 rounded-xl border border-gray-100 dark:border-gray-700 bg-gray-50 dark:bg-gray-900/30">
                                        <div className="flex items-center gap-4">
                                            <span className="text-gray-400 font-mono font-bold w-6">{idx + 1}.</span>
                                            <div><p className="font-bold dark:text-gray-200">{new Date(item.scheduledDate).toLocaleDateString()}</p><p className="text-xs text-gray-500 font-mono mt-1">{new Date(item.scheduledDate).toLocaleTimeString()}</p></div>
                                        </div>
                                        <button onClick={() => setGeneratedPreview(prev => prev.filter(p => p.id !== item.id))} className="text-gray-400 hover:text-red-500"><i className="fas fa-trash-alt"></i></button>
                                    </div>
                                ))}
                            </div>
                            {generatedPreview.length > 0 && (
                                <div className="p-5 border-t border-gray-100 dark:border-gray-700">
                                    {isProcessing ? (
                                        <div className="space-y-3">
                                            <div className="flex justify-between text-sm font-bold dark:text-gray-300"><span>Processing...</span><span>{progress.current} / {progress.total}</span></div>
                                            <div className="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-3"><div className="bg-fb h-3 rounded-full transition-all" style={{ width: `${(progress.current / progress.total) * 100}%` }}></div></div>
                                        </div>
                                    ) : (
                                        <button onClick={() => processQueue(generatedPreview)} className="w-full bg-fb text-white font-bold py-4 rounded-xl">Schedule All via API</button>
                                    )}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function PostList({ posts, setPosts, pages, addLog }) {
            const [searchTerm, setSearchTerm] = useState('');
            const filteredPosts = posts.filter(p => p.payload.text.toLowerCase().includes(searchTerm.toLowerCase())).sort((a, b) => new Date(a.scheduledDate).getTime() - new Date(b.scheduledDate).getTime());

            return (
                <div className="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 flex flex-col h-full animate-fade-in">
                    <div className="p-5 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center bg-gray-50/50 dark:bg-gray-900/20">
                        <input type="text" placeholder="Search..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} className="px-4 py-2 bg-white dark:bg-gray-900 border border-gray-300 dark:border-gray-600 rounded-xl outline-none dark:text-white" />
                    </div>
                    <div className="flex-1 overflow-auto">
                        <table className="w-full text-left text-sm whitespace-nowrap">
                            <thead className="bg-gray-100 dark:bg-gray-900/80 text-gray-600 dark:text-gray-400 sticky top-0">
                                <tr><th className="p-4 font-bold">Content</th><th className="p-4 font-bold">Page</th><th className="p-4 font-bold">Scheduled Time</th><th className="p-4 font-bold">Status</th></tr>
                            </thead>
                            <tbody className="divide-y divide-gray-100 dark:divide-gray-700/50">
                                {filteredPosts.map(post => (
                                    <tr key={post.id} className="hover:bg-gray-50 dark:hover:bg-gray-800/80">
                                        <td className="p-4"><div className="max-w-xs truncate dark:text-gray-200">{post.payload.text || '(Media)'}</div>{post.errorMsg && <div className="text-xs text-red-500 truncate max-w-xs mt-1">{post.errorMsg}</div>}</td>
                                        <td className="p-4 text-gray-500 dark:text-gray-400">{pages.find(p => p.id === post.pageId)?.name || 'Unknown'}</td>
                                        <td className="p-4 font-mono text-xs dark:text-gray-300">{new Date(post.scheduledDate).toLocaleString()}</td>
                                        <td className="p-4"><StatusBadge status={post.status} /></td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        function LoginScreen({ onLogin, theme, toggleTheme }) {
            const [loading, setLoading] = useState(false);
            const [appId, setAppId] = useState(() => DB.get('fb_app_id', ''));
            const [error, setError] = useState('');
            
            useEffect(() => { if (appId.trim()) GraphAPI.init(appId.trim()).catch(e => setError(e.message)); }, [appId]);

            const handleLogin = () => {
                if (!appId.trim()) return setError('يرجى إدخال Facebook App ID الخاص بك.');
                if (!window.FB) return setError('جاري تجهيز الاتصال، تأكد من إدخال App ID صحيح وأنك ألغيت مانع الإعلانات.');
                setLoading(true); setError(''); DB.set('fb_app_id', appId.trim());

                GraphAPI.login().then(async (authResponse) => {
                    try {
                        const userInfo = await GraphAPI.getUserInfo();
                        const userPages = await GraphAPI.getPages();
                        onLogin({ user: { id: userInfo.id, name: userInfo.name, picture: userInfo.picture?.data?.url }, pages: userPages });
                    } catch (err) { setError('حدث خطأ أثناء جلب الصفحات.'); setLoading(false); }
                }).catch(err => { setError(err.message); setLoading(false); });
            };

            return (
                <div className={`min-h-screen flex items-center justify-center bg-gray-50 dark:bg-gray-900 transition-colors ${theme}`}>
                    <div className="max-w-md w-full p-10 bg-white dark:bg-gray-800 rounded-3xl shadow-2xl border border-gray-100 dark:border-gray-700 text-center">
                        <div className="w-20 h-20 bg-gradient-to-tr from-fb to-blue-500 rounded-2xl flex items-center justify-center mx-auto mb-6"><i className="fab fa-facebook-f text-4xl text-white"></i></div>
                        <h1 className="text-2xl font-extrabold text-gray-900 dark:text-white mb-2">Facebook Scheduler</h1>
                        
                        <div className="mb-6 mt-6 text-left">
                            <label className="block text-sm font-bold mb-2 dark:text-gray-300">Facebook App ID</label>
                            <input type="text" value={appId} onChange={(e) => setAppId(e.target.value)} placeholder="مثال: 123456789012345" className="w-full bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white border border-gray-300 dark:border-gray-600 rounded-xl px-4 py-3 outline-none focus:border-fb" />
                            {error && <p className="text-red-500 text-xs mt-2 font-medium">{error}</p>}
                        </div>

                        <button onClick={handleLogin} disabled={loading} className="w-full flex items-center justify-center gap-3 bg-fb hover:bg-fb-hover text-white py-4 px-6 rounded-xl font-bold shadow-xl">
                            {loading ? <i className="fas fa-spinner fa-spin"></i> : <i className="fab fa-facebook"></i>}
                            {loading ? 'جاري الاتصال...' : 'تسجيل الدخول'}
                        </button>
                    </div>
                </div>
            );
        }

        function Sidebar({ view, setView, user, onLogout }) {
            const nav = [{ id: 'dashboard', icon: 'fa-chart-pie', label: 'Dashboard' }, { id: 'scheduler', icon: 'fa-plus-square', label: 'New Schedule' }, { id: 'posts', icon: 'fa-tasks', label: 'Queue Manager' }];
            return (
                <aside className="w-64 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 flex flex-col hidden md:flex">
                    <div className="p-6 flex items-center gap-3"><div className="bg-fb w-8 h-8 rounded flex items-center justify-center"><i className="fab fa-facebook-f text-white"></i></div><span className="font-bold text-lg dark:text-white">BulkSched</span></div>
                    <nav className="flex-1 px-4 py-2 space-y-1">{nav.map(i => <button key={i.id} onClick={() => setView(i.id)} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-sm ${view === i.id ? 'bg-blue-50 dark:bg-fb text-fb dark:text-white' : 'text-gray-600 dark:text-gray-400'}`}><i className={`fas ${i.icon}`}></i> {i.label}</button>)}</nav>
                    <div className="p-4 border-t border-gray-100 dark:border-gray-700"><div className="flex items-center gap-3 p-2 bg-gray-50 dark:bg-gray-900 rounded-xl"><img src={user.picture} className="w-8 h-8 rounded-lg" /><div className="flex-1"><p className="text-xs font-bold dark:text-white">{user.name}</p></div><button onClick={onLogout} className="text-red-500"><i className="fas fa-sign-out-alt"></i></button></div></div>
                </aside>
            );
        }

        function App() {
            const [theme, setTheme] = useState('light');
            const [user, setUser] = useState(null);
            const [view, setView] = useState('dashboard');
            const [pages, setPages] = useState([]);
            const [posts, setPosts] = useState(() => DB.get('posts', []));
            const [logs, setLogs] = useState([]);
            const settings = { timezone: Intl.DateTimeFormat().resolvedOptions().timeZone, defaultPostingTimes: ['09:00', '15:00', '21:00'] };

            useEffect(() => { DB.set('posts', posts); }, [posts]);
            useEffect(() => { if (theme === 'dark') document.documentElement.classList.add('dark'); else document.documentElement.classList.remove('dark'); }, [theme]);

            const addLog = useCallback((level, action, details) => { console.log(`[${level}] ${action}: ${details}`); }, []);

            const login = (authData) => { setUser(authData.user); setPages(authData.pages); };
            const logout = () => { setUser(null); setPages([]); if (window.FB) window.FB.logout(); };

            if (!user) return <LoginScreen onLogin={login} theme={theme} toggleTheme={() => setTheme(t => t === 'dark' ? 'light' : 'dark')} />;

            return (
                <div className={`min-h-screen flex transition-colors duration-200 ${theme}`}>
                    <Sidebar view={view} setView={setView} user={user} onLogout={logout} />
                    <main className="flex-1 flex flex-col h-screen overflow-hidden bg-gray-50 dark:bg-gray-900 relative">
                        <header className="h-20 bg-white/80 dark:bg-gray-900/80 border-b border-gray-200 dark:border-gray-800 flex items-center justify-between px-8"><h2 className="text-2xl font-extrabold dark:text-white capitalize">{view}</h2></header>
                        <div className="flex-1 overflow-y-auto p-6 md:p-8">
                            {view === 'dashboard' && <Dashboard posts={posts} />}
                            {view === 'scheduler' && <Scheduler pages={pages} settings={settings} setPosts={setPosts} addLog={addLog} />}
                            {view === 'posts' && <PostList posts={posts} setPosts={setPosts} pages={pages} addLog={addLog} />}
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
